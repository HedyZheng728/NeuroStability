name: neurostability-arena
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: arena
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U arena -d arena]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      args:
        WITH_POSE: ${WITH_POSE:-false}
        WITH_SEGMENTATION: ${WITH_SEGMENTATION:-false}
        WITH_REVIEW: ${WITH_REVIEW:-false}
        WITH_POSE3D: ${WITH_POSE3D:-false}
        WITH_ACTION: ${WITH_ACTION:-false}
    env_file: .env
    environment:
      ARENA_ENV: production
      DATABASE_URL: postgresql+psycopg://arena:${POSTGRES_PASSWORD}@db:5432/arena
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        WITH_POSE: ${WITH_POSE:-false}
        WITH_SEGMENTATION: ${WITH_SEGMENTATION:-false}
        WITH_REVIEW: ${WITH_REVIEW:-false}
        WITH_POSE3D: ${WITH_POSE3D:-false}
        WITH_ACTION: ${WITH_ACTION:-false}
    command: [python, -m, arena.worker]
    healthcheck:
      disable: true
    env_file: .env
    environment:
      ARENA_ENV: production
      DATABASE_URL: postgresql+psycopg://arena:${POSTGRES_PASSWORD}@db:5432/arena
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    environment:
      ARENA_DOMAIN: ${ARENA_DOMAIN:?请设置域名}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
