    <path d="M390 191c-18 7-29 3-34-8 13 2 14-13 30-13l13 13Z" fill="#263551" stroke="#6e7e9f" stroke-width="1.8"/>
    <path d="M510 191c18 7 29 3 34-8-13 2-14-13-30-13l-13 13Z" fill="#263551" stroke="#6e7e9f" stroke-width="1.8"/>
    <path d="m425 218 7 4m43-4-7 4m-42 13 6 2m42-2-6 2" fill="none" stroke-width="2"/>
