    <path d="m422 244-18-8-11 3-6 12 8 12 19 1Z" fill="#e5b093"/>
    <path d="m398 244-3 9m8-6-2 11m97-14 3 9m-8-6 2 11" fill="none" stroke="#aa7561" stroke-width="1.5"/>
    <path d="m317 471 11-1m-4 6 11-1m248-4-11-1m4 6-11-1M126 461l12-1m636 1-12-1" fill="none" stroke="#aab6cf" stroke-width="2"/>
  </g>
</svg>
